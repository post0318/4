name: Refresh NTN-F snapshot

# 브라질채권검색·트레이딩 탭이 쓰는 시세 스냅샷(src/lib/server/ntnf-snapshot.json)을
# 갱신한다. 원본은 tesourotransparente.gov.br의 14MB CSV뿐이라 앱 요청 시점에
# 받을 수 없어(약 44초), 여기서 받아 파싱한 결과만 커밋한다. 커밋이 push되면
# Vercel이 자동 재배포하며 최신 시세가 반영된다.
#
# 매일 22:00 UTC(07:00 KST 익일). 브라질 시장 마감(약 21:00 UTC) 뒤라 그날 종가가
# CSV에 실린 상태이고, 한국 근무 시작 전에 반영된다. 주말·브라질 휴일에는 CSV가
# 그대로라 아래 "데이터 변경 없음" 로직이 커밋을 건너뛴다(불필요한 재배포 방지).
#
# 예전에는 주간(일요일 12:00 UTC)이었다. 5번 프로젝트(글로벌 종목 리서치)가 매주
# 월요일 00:00 UTC 에 이 저장소의 ntnf-yield-history.json 을 GitHub raw 로 읽는데,
# 매일 갱신이면 토요일 22:00 UTC 실행분에 금요일 종가가 이미 들어 있어 그 요구도
# 계속 충족한다.

on:
  schedule:
    - cron: "0 22 * * *" # 매일 22:00 UTC (07:00 KST 익일)
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Fetch latest NTN-F snapshot
        run: node scripts/fetch-ntnf-snapshot.mjs

      - name: Commit if data changed
        run: |
          SNAP=src/lib/server/ntnf-snapshot.json
          HIST=src/lib/server/ntnf-yield-history.json
          # generatedAt/source/liveSource 줄만 바뀐 경우는 실질 변경이 아니므로
          # 커밋하지 않는다(매일 불필요한 재배포 방지). liveAsOfDate는 제외하지
          # 않는다 — 거래 플랫폼 실제 기준일(오너 지시, 2026-09-24)이라 이 값이
          # 바뀌면 시세도 같이 바뀐 것. 스냅샷 시세 또는 금리추이 데이터가 실제로
          # 바뀐 경우에만 두 파일을 함께 커밋한다.
          SNAP_CHANGES=$(git diff -U0 -- "$SNAP" \
            | grep -E '^[+-]' | grep -vE '^[+-]{3} ' \
            | grep -vE '"(generatedAt|source|liveSource)"' || true)
          HIST_CHANGES=$(git diff -U0 -- "$HIST" \
            | grep -E '^[+-]' | grep -vE '^[+-]{3} ' \
            | grep -vE '"(generatedAt)"' || true)
          if [ -z "$SNAP_CHANGES" ] && [ -z "$HIST_CHANGES" ]; then
            echo "데이터 변경 없음 - 커밋 생략"
            git checkout -- "$SNAP" "$HIST"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SNAP" "$HIST"
          git commit -m "chore : NTN-F 시세·금리추이 자동 갱신 ($(date -u +%Y-%m-%d))"
          git push
