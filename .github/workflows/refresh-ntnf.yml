name: Refresh NTN-F snapshot

# 브라질채권검색이 쓰는 시세 스냅샷(src/lib/server/ntnf-snapshot.json)을 주간으로
# 갱신한다. 원본은 tesourotransparente.gov.br의 14MB CSV뿐이라 앱 요청 시점에
# 받을 수 없어(40초), 여기서 받아 파싱한 결과만 커밋한다. 커밋이 push되면
# Vercel이 자동 재배포하며 최신 시세가 반영된다.

on:
  schedule:
    - cron: "0 9 * * 1" # 매주 월요일 09:00 UTC
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest NTN-F snapshot
        run: node scripts/fetch-ntnf-snapshot.mjs

      - name: Commit if rates changed
        run: |
          # generatedAt/source 줄만 바뀐 경우는 실질 변경이 아니므로 커밋하지 않는다
          # (매주 불필요한 재배포 방지).
          RATE_CHANGES=$(git diff -U0 -- src/lib/server/ntnf-snapshot.json \
            | grep -E '^[+-]' | grep -vE '^[+-]{3} ' \
            | grep -vE '"(generatedAt|source)"' || true)
          if [ -z "$RATE_CHANGES" ]; then
            echo "시세 변경 없음 - 커밋 생략"
            git checkout -- src/lib/server/ntnf-snapshot.json
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/server/ntnf-snapshot.json
          git commit -m "chore : NTN-F 시세 스냅샷 자동 갱신 ($(date -u +%Y-%m-%d))"
          git push
