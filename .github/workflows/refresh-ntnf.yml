name: Refresh NTN-F snapshot

# 브라질채권검색이 쓰는 시세 스냅샷(src/lib/server/ntnf-snapshot.json)을 주간으로
# 갱신한다. 원본은 tesourotransparente.gov.br의 14MB CSV뿐이라 앱 요청 시점에
# 받을 수 없어(40초), 여기서 받아 파싱한 결과만 커밋한다. 커밋이 push되면
# Vercel이 자동 재배포하며 최신 시세가 반영된다.
#
# 스케줄을 월요일 09:00 UTC → 일요일 12:00 UTC 로 앞당김(2026-09): 5번
# 프로젝트(글로벌 종목 리서치)의 주간 거시 리포트가 매주 월요일 00:00 UTC
# (09:00 KST)에 이 저장소의 ntnf-yield-history.json 을 GitHub raw 로 읽는데,
# 월요일 갱신이면 한 주 전 금요일 값이 들어가서 — 금요일 종가가 CSV에 반영된
# 뒤(주말)에 갱신해 월요일 아침엔 지난주 금요일까지 있도록 한다.

on:
  schedule:
    - cron: "0 12 * * 0" # 매주 일요일 12:00 UTC (21:00 KST)
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest NTN-F snapshot
        run: node scripts/fetch-ntnf-snapshot.mjs

      - name: Commit if data changed
        run: |
          SNAP=src/lib/server/ntnf-snapshot.json
          HIST=src/lib/server/ntnf-yield-history.json
          # generatedAt/source 줄만 바뀐 경우는 실질 변경이 아니므로 커밋하지 않는다
          # (매주 불필요한 재배포 방지). 스냅샷 시세 또는 금리추이 데이터가 실제로
          # 바뀐 경우에만 두 파일을 함께 커밋한다.
          SNAP_CHANGES=$(git diff -U0 -- "$SNAP" \
            | grep -E '^[+-]' | grep -vE '^[+-]{3} ' \
            | grep -vE '"(generatedAt|source)"' || true)
          HIST_CHANGES=$(git diff -U0 -- "$HIST" \
            | grep -E '^[+-]' | grep -vE '^[+-]{3} ' \
            | grep -vE '"(generatedAt)"' || true)
          if [ -z "$SNAP_CHANGES" ] && [ -z "$HIST_CHANGES" ]; then
            echo "데이터 변경 없음 - 커밋 생략"
            git checkout -- "$SNAP" "$HIST"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SNAP" "$HIST"
          git commit -m "chore : NTN-F 시세·금리추이 자동 갱신 ($(date -u +%Y-%m-%d))"
          git push
